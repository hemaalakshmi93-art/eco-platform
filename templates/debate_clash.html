<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌍 Debate Clash</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a1a0e;
  --surface: #0f2414;
  --card: #142b18;
  --green: #22c55e;
  --green2: #16a34a;
  --lime: #a3e635;
  --red: #ef4444;
  --amber: #f59e0b;
  --blue: #60a5fa;
  --text: #e8f5e9;
  --muted: #6b8f72;
  --border: rgba(34,197,94,0.2);
  --glow: rgba(34,197,94,0.15);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
body {
  background: var(--bg);
  font-family: 'Outfit', sans-serif;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
 
/* animated bg */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 600px 400px at 20% 20%, rgba(34,197,94,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 400px 600px at 80% 80%, rgba(16,163,74,0.05) 0%, transparent 70%);
  pointer-events: none;
}
 
/* ── SCREENS ── */
.screen { position: relative; z-index: 1; display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }
 
/* ── LOBBY ── */
#lobby {
  align-items: center; justify-content: center;
  padding: 24px 20px; text-align: center;
  animation: fadeIn .5s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
 
.logo-ring {
  width: 90px; height: 90px; border-radius: 50%;
  border: 2px solid var(--green);
  display: flex; align-items: center; justify-content: center;
  font-size: 40px; margin: 0 auto 20px;
  box-shadow: 0 0 30px var(--glow), inset 0 0 20px var(--glow);
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{box-shadow:0 0 30px var(--glow),inset 0 0 20px var(--glow);} 50%{box-shadow:0 0 60px rgba(34,197,94,0.3),inset 0 0 30px rgba(34,197,94,0.2);} }
 
.app-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(32px, 8vw, 52px);
  font-weight: 800; letter-spacing: -1px;
  background: linear-gradient(135deg, #22c55e, #a3e635);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  line-height: 1; margin-bottom: 6px;
}
.app-sub { font-size: 14px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 32px; }
 
.topics-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; width: 100%; max-width: 500px; margin-bottom: 28px;
}
.topic-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 14px; padding: 14px 12px;
  cursor: pointer; text-align: left;
  transition: all .2s ease;
  position: relative; overflow: hidden;
}
.topic-card::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--glow), transparent);
  opacity: 0; transition: opacity .2s;
}
.topic-card:hover, .topic-card.selected {
  border-color: var(--green);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(34,197,94,0.2);
}
.topic-card:hover::before, .topic-card.selected::before { opacity: 1; }
.topic-card.selected { background: rgba(34,197,94,0.12); }
.topic-icon { font-size: 24px; margin-bottom: 6px; }
.topic-title { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; color: var(--green); line-height: 1.3; margin-bottom: 4px; }
.topic-desc { font-size: 10px; color: var(--muted); line-height: 1.4; }
 
.side-pick { margin-bottom: 24px; width: 100%; max-width: 500px; }
.side-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.side-btns { display: flex; gap: 10px; }
.side-btn {
  flex: 1; padding: 12px; border-radius: 12px;
  border: 1.5px solid var(--border); background: var(--card);
  color: var(--text); font-family: 'Outfit', sans-serif;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all .2s;
}
.side-btn.pro { border-color: rgba(34,197,94,0.4); }
.side-btn.con { border-color: rgba(239,68,68,0.4); }
.side-btn.pro.active { background: rgba(34,197,94,0.2); border-color: var(--green); color: var(--green); }
.side-btn.con.active { background: rgba(239,68,68,0.15); border-color: var(--red); color: var(--red); }
 
.start-btn {
  width: 100%; max-width: 500px;
  padding: 16px; border-radius: 14px; border: none;
  background: linear-gradient(135deg, var(--green2), var(--green));
  color: #fff; font-family: 'Syne', sans-serif;
  font-size: 16px; font-weight: 700; cursor: pointer;
  letter-spacing: 0.5px;
  transition: all .2s;
  box-shadow: 0 4px 20px rgba(34,197,94,0.3);
}
.start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(34,197,94,0.4); }
.start-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
 
/* ── GAME SCREEN ── */
#game { flex-direction: column; padding: 0; }
 
.game-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 20;
}
.back-btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--card);
  color: var(--text); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.game-topic-name {
  flex: 1; font-family: 'Syne', sans-serif;
  font-size: 13px; font-weight: 700; color: var(--green);
  line-height: 1.3;
}
.round-badge {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; padding: 4px 10px;
  font-size: 11px; font-weight: 600; color: var(--muted);
  white-space: nowrap;
}
 
/* scoreboard */
.scoreboard {
  display: flex; gap: 8px; padding: 10px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.score-side {
  flex: 1; background: var(--card); border-radius: 10px;
  padding: 8px 12px; text-align: center;
  border: 1px solid var(--border);
}
.score-side.you { border-color: rgba(34,197,94,0.35); }
.score-side.ai  { border-color: rgba(239,68,68,0.25); }
.score-who { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 2px; }
.score-num { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; }
.score-side.you .score-num { color: var(--green); }
.score-side.ai  .score-num { color: var(--red); }
.score-vs { display: flex; align-items: center; justify-content: center; font-family:'Syne',sans-serif; font-size:11px; font-weight:700; color:var(--muted); padding: 0 4px; }
 
/* motion bar */
.motion-bar {
  margin: 10px 14px 0;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px;
}
.motion-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.motion-text { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.4; }
.side-indicator {
  display: inline-flex; align-items: center; gap: 5px;
  margin-top: 6px; padding: 3px 10px; border-radius: 20px;
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
}
.side-indicator.pro { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
.side-indicator.con { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.25); }
 
/* chat */
.chat-area {
  flex: 1; overflow-y: auto; padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
  scroll-behavior: smooth;
}
 
.msg {
  display: flex; gap: 8px; animation: msgIn .3s ease;
  max-width: 100%;
}
@keyframes msgIn { from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);} }
 
.msg.user { flex-direction: row-reverse; }
.msg-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0; border: 1.5px solid transparent;
}
.msg.user .msg-avatar { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.4); }
.msg.ai .msg-avatar { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); }
.msg.system .msg-avatar { background: rgba(96,165,250,0.15); border-color: rgba(96,165,250,0.4); font-size: 16px; }
.msg.correction .msg-avatar { background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.4); }
 
.msg-content { flex: 1; min-width: 0; }
.msg-name { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 4px; }
.msg.user .msg-name { text-align: right; color: rgba(34,197,94,0.7); }
 
.bubble {
  padding: 10px 14px; border-radius: 14px;
  font-size: 13.5px; line-height: 1.6;
  max-width: 340px; word-break: break-word;
  position: relative;
}
.msg.user .bubble {
  background: rgba(34,197,94,0.15);
  border: 1px solid rgba(34,197,94,0.3);
  border-radius: 14px 4px 14px 14px;
  margin-left: auto;
}
.msg.ai .bubble {
  background: var(--card);
  border: 1px solid rgba(239,68,68,0.2);
  border-radius: 4px 14px 14px 14px;
}
.msg.system .bubble {
  background: rgba(96,165,250,0.08);
  border: 1px solid rgba(96,165,250,0.25);
  border-radius: 10px; color: #93c5fd;
  font-style: italic; font-size: 12.5px;
}
.msg.correction .bubble {
  background: rgba(245,158,11,0.08);
  border: 1px solid rgba(245,158,11,0.3);
  border-radius: 10px; padding: 12px 14px;
}
.correction-header {
  font-family: 'Syne', sans-serif; font-size: 11px;
  font-weight: 700; color: var(--amber); text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 6px;
  display: flex; align-items: center; gap: 5px;
}
.correction-wrong {
  font-size: 12px; color: rgba(239,68,68,0.8);
  background: rgba(239,68,68,0.08); border-radius: 6px;
  padding: 5px 9px; margin-bottom: 6px;
  text-decoration: line-through; font-style: italic;
}
.correction-right {
  font-size: 13px; color: var(--text); line-height: 1.5;
}
.fact-chip {
  display: inline-block; margin-top: 8px;
  background: rgba(163,230,53,0.12); border: 1px solid rgba(163,230,53,0.3);
  border-radius: 20px; padding: 3px 10px;
  font-size: 11px; color: var(--lime); font-weight: 600;
}
 
/* score flash */
.score-flash {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 6px; padding: 3px 9px; border-radius: 20px;
  font-size: 11px; font-weight: 700;
  background: rgba(34,197,94,0.15); color: var(--green);
  border: 1px solid rgba(34,197,94,0.3);
  animation: pop .4s ease;
}
@keyframes pop { 0%{transform:scale(0.8);opacity:0;}60%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;} }
.score-flash.deduct { background: rgba(239,68,68,0.12); color: var(--red); border-color: rgba(239,68,68,0.3); }
 
/* typing indicator */
.typing { display: flex; align-items: center; gap: 4px; padding: 10px 14px; }
.typing span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--red); opacity: 0.6;
  animation: blink 1.2s ease-in-out infinite;
}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{transform:scale(1);opacity:0.6;}40%{transform:scale(1.3);opacity:1;}}
 
/* input area */
.input-area {
  padding: 10px 14px 14px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  position: sticky; bottom: 0; z-index: 20;
}
.input-wrap { display: flex; gap: 8px; align-items: flex-end; }
.arg-input {
  flex: 1; background: var(--card);
  border: 1.5px solid var(--border); border-radius: 12px;
  padding: 10px 14px; color: var(--text);
  font-family: 'Outfit', sans-serif; font-size: 13.5px;
  resize: none; outline: none; min-height: 42px; max-height: 100px;
  line-height: 1.4; transition: border-color .2s;
}
.arg-input:focus { border-color: var(--green); }
.arg-input::placeholder { color: var(--muted); }
.send-btn {
  width: 42px; height: 42px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, var(--green2), var(--green));
  color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
  box-shadow: 0 4px 12px rgba(34,197,94,0.3);
}
.send-btn:hover { transform: scale(1.08); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
 
.hint-chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.hint-chip {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 11px;
  font-size: 11px; color: var(--muted); cursor: pointer;
  transition: all .2s;
}
.hint-chip:hover { border-color: var(--green); color: var(--green); }
 
/* turns indicator */
.turns-row {
  display: flex; gap: 4px; padding: 8px 14px 0;
}
.turn-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border); transition: background .3s;
}
.turn-dot.done { background: var(--green); }
.turn-dot.current { background: var(--amber); animation: blink 1s ease-in-out infinite; }
 
/* ── END SCREEN ── */
#endscreen {
  align-items: center; justify-content: center;
  padding: 32px 20px; text-align: center;
  animation: fadeIn .6s ease;
}
.result-icon { font-size: 64px; margin-bottom: 16px; animation: pop .5s ease; }
.result-title { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.result-title.win { background: linear-gradient(135deg, var(--green), var(--lime)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.result-title.lose { color: var(--red); }
.result-title.tie { color: var(--amber); }
.result-sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.6; max-width: 360px; }
 
.final-scores {
  display: flex; gap: 16px; margin-bottom: 28px;
}
.final-score-box {
  flex: 1; background: var(--card); border: 1.5px solid var(--border);
  border-radius: 14px; padding: 16px;
}
.final-score-box.you { border-color: rgba(34,197,94,0.4); }
.final-score-box.ai  { border-color: rgba(239,68,68,0.35); }
.fs-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.fs-num { font-family:'Syne',sans-serif; font-size: 36px; font-weight:800; }
.final-score-box.you .fs-num { color: var(--green); }
.final-score-box.ai  .fs-num { color: var(--red); }
 
.facts-recap {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px; margin-bottom: 24px;
  width: 100%; max-width: 420px; text-align: left;
}
.facts-recap-title { font-family:'Syne',sans-serif; font-size:12px; font-weight:700; color:var(--lime); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
.fact-item { font-size: 12px; color: var(--muted); padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); line-height: 1.5; }
.fact-item:last-child { border: none; }
 
.end-btns { display: flex; gap: 10px; width: 100%; max-width: 420px; }
.end-btn {
  flex: 1; padding: 14px; border-radius: 12px; border: none;
  font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all .2s;
}
.end-btn.primary { background: linear-gradient(135deg, var(--green2), var(--green)); color: #fff; }
.end-btn.secondary { background: var(--card); color: var(--text); border: 1.5px solid var(--border); }
 
/* loading overlay */
#loading-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
  transition: opacity .4s;
}
#loading-overlay.hidden { opacity: 0; pointer-events: none; }
.loader-ring {
  width: 60px; height: 60px; border-radius: 50%;
  border: 3px solid var(--border);
  border-top-color: var(--green);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text { font-size: 13px; color: var(--muted); }
 
/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
 
<div id="loading-overlay">
  <div class="loader-ring"></div>
  <div class="loader-text">Initializing Debate Engine…</div>
</div>
 
<!-- ── LOBBY ── -->
<div class="screen active" id="lobby">
  <div class="logo-ring">🌍</div>
  <div class="app-title">DEBATE CLASH</div>
  <div class="app-sub">Environmental Showdown · AI vs You</div>
 
  <div class="topics-grid" id="topics-grid"></div>
 
  <div class="side-pick">
    <div class="side-label">Choose your stance</div>
    <div class="side-btns">
      <button class="side-btn pro active" id="btn-pro" onclick="pickSide('pro')">✅ PRO — Support</button>
      <button class="side-btn con" id="btn-con" onclick="pickSide('con')">❌ CON — Oppose</button>
    </div>
  </div>
 
  <button class="start-btn" id="start-btn" onclick="startDebate()">⚡ Start Debate</button>
</div>
 
<!-- ── GAME ── -->
<div class="screen" id="game">
  <div class="game-header">
    <button class="back-btn" onclick="showLobby()">‹</button>
    <div class="game-topic-name" id="game-topic-name">Topic</div>
    <div class="round-badge" id="round-badge">Round 1/5</div>
  </div>
 
  <div class="scoreboard">
    <div class="score-side you">
      <div class="score-who">You</div>
      <div class="score-num" id="score-you">0</div>
    </div>
    <div class="score-vs">VS</div>
    <div class="score-side ai">
      <div class="score-who">AI Debater</div>
      <div class="score-num" id="score-ai">0</div>
    </div>
  </div>
 
  <div class="motion-bar">
    <div class="motion-label">🎙️ Motion</div>
    <div class="motion-text" id="motion-text">Loading…</div>
    <div class="side-indicator" id="side-indicator">PRO</div>
  </div>
 
  <div class="turns-row" id="turns-row"></div>
 
  <div class="chat-area" id="chat-area"></div>
 
  <div class="input-area">
    <div class="input-wrap">
      <textarea class="arg-input" id="arg-input" placeholder="Make your argument…" rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendArgument()">➤</button>
    </div>
    <div class="hint-chips" id="hint-chips"></div>
  </div>
</div>
 
<!-- ── END ── -->
<div class="screen" id="endscreen">
  <div class="result-icon" id="result-icon">🏆</div>
  <div class="result-title" id="result-title">You Won!</div>
  <div class="result-sub" id="result-sub"></div>
  <div class="final-scores">
    <div class="final-score-box you">
      <div class="fs-label">Your Score</div>
      <div class="fs-num" id="final-you">0</div>
    </div>
    <div class="final-score-box ai">
      <div class="fs-label">AI Score</div>
      <div class="fs-num" id="final-ai">0</div>
    </div>
  </div>
  <div class="facts-recap" id="facts-recap">
    <div class="facts-recap-title">🌱 Key Facts You Learned</div>
    <div id="facts-list"></div>
  </div>
  <div class="end-btns">
    <button class="end-btn primary" onclick="startDebate()">🔄 Rematch</button>
    <button class="end-btn secondary" onclick="showLobby()">🏠 Menu</button>
  </div>
</div>
 
<script>
// ── TOPICS ──────────────────────────────────────────────────────────────────
const TOPICS = [
  {
    id: 'solar',
    icon: '☀️',
    title: 'Solar Over Coal',
    desc: 'Solar energy should fully replace coal power plants',
    motion: 'This house believes that solar energy should completely replace coal power plants within 20 years.',
    proHints: ['cost of solar', 'pollution', 'jobs created', 'energy independence'],
    conHints: ['intermittency issue', 'grid stability', 'upfront cost', 'land use']
  },
  {
    id: 'plastic',
    icon: '🛍️',
    title: 'Ban Single-Use Plastic',
    desc: 'All single-use plastics should be globally banned',
    motion: 'This house believes that single-use plastics should be banned worldwide immediately.',
    proHints: ['ocean pollution', 'microplastics', 'alternatives exist', 'wildlife harm'],
    conHints: ['food safety', 'developing nations', 'economic impact', 'medical use']
  },
  {
    id: 'meat',
    icon: '🥩',
    title: 'Reduce Meat Consumption',
    desc: 'Governments should tax meat to reduce consumption',
    motion: 'This house believes governments should impose a carbon tax on meat to combat climate change.',
    proHints: ['methane emissions', 'land use', 'water waste', 'deforestation'],
    conHints: ['food sovereignty', 'cultural rights', 'nutrition access', 'farmers livelihoods']
  },
  {
    id: 'evs',
    icon: '⚡',
    title: 'Electric Vehicles Only',
    desc: 'Ban petrol/diesel car sales by 2030',
    motion: 'This house believes that the sale of new petrol and diesel vehicles should be banned by 2030.',
    proHints: ['air quality', 'net zero', 'battery tech progress', 'fuel costs'],
    conHints: ['charging infrastructure', 'battery mining', 'range anxiety', 'rural access']
  }
];
 
// ── STATE ────────────────────────────────────────────────────────────────────
let selectedTopic = TOPICS[0];
let playerSide = 'pro';
let scoreYou = 0, scoreAI = 0;
let currentRound = 0;
const MAX_ROUNDS = 5;
let isAITurn = false;
let learnedFacts = [];
let conversationHistory = [];
let debateActive = false;
 
// ── INIT ─────────────────────────────────────────────────────────────────────
function init() {
  renderTopics();
  selectTopic(TOPICS[0]);
  setTimeout(() => {
    document.getElementById('loading-overlay').classList.add('hidden');
  }, 1200);
}
 
function renderTopics() {
  const grid = document.getElementById('topics-grid');
  grid.innerHTML = TOPICS.map((t, i) => `
    <div class="topic-card${i===0?' selected':''}" id="tc-${t.id}" onclick="selectTopic(TOPICS[${i}])">
      <div class="topic-icon">${t.icon}</div>
      <div class="topic-title">${t.title}</div>
      <div class="topic-desc">${t.desc}</div>
    </div>
  `).join('');
}
 
function selectTopic(topic) {
  selectedTopic = topic;
  document.querySelectorAll('.topic-card').forEach(c => c.classList.remove('selected'));
  const el = document.getElementById('tc-' + topic.id);
  if (el) el.classList.add('selected');
}
 
function pickSide(side) {
  playerSide = side;
  document.getElementById('btn-pro').classList.toggle('active', side === 'pro');
  document.getElementById('btn-con').classList.toggle('active', side === 'con');
}
 
// ── SCREEN NAV ───────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showLobby() { showScreen('lobby'); debateActive = false; }
 
// ── DEBATE START ─────────────────────────────────────────────────────────────
function startDebate() {
  scoreYou = 0; scoreAI = 0; currentRound = 0;
  learnedFacts = []; conversationHistory = [];
  debateActive = true;
 
  document.getElementById('score-you').textContent = '0';
  document.getElementById('score-ai').textContent = '0';
  document.getElementById('chat-area').innerHTML = '';
 
  document.getElementById('game-topic-name').textContent = selectedTopic.icon + ' ' + selectedTopic.title;
  document.getElementById('motion-text').textContent = selectedTopic.motion;
 
  const si = document.getElementById('side-indicator');
  if (playerSide === 'pro') {
    si.textContent = '✅ You are PRO — Supporting the motion';
    si.className = 'side-indicator pro';
  } else {
    si.textContent = '❌ You are CON — Opposing the motion';
    si.className = 'side-indicator con';
  }
 
  renderTurnDots();
  updateRoundBadge();
  updateHints();
  showScreen('game');
 
  // Opening system message
  addSystemMsg('🎙️ The debate has begun! Make your opening argument. Be specific and use facts!');
 
  // Build conversation context
  conversationHistory = [{
    role: 'user',
    content: buildSystemPrompt()
  }];
 
  setTimeout(() => {
    addSystemMsg('💡 Tip: The AI will fact-check your claims in real-time. Strong arguments earn points!');
    document.getElementById('arg-input').focus();
  }, 800);
}
 
function buildSystemPrompt() {
  const aiSide = playerSide === 'pro' ? 'CON' : 'PRO';
  return `You are an expert AI debate coach and opponent in an environmental debate game called "Debate Clash". 
 
DEBATE TOPIC: ${selectedTopic.motion}
 
THE PLAYER is on the ${playerSide.toUpperCase()} side (${playerSide === 'pro' ? 'supporting' : 'opposing'} the motion).
YOU are on the ${aiSide} side (${aiSide === 'pro' ? 'supporting' : 'opposing'} the motion).
 
YOUR ROLE: You have TWO jobs in every response:
1. FACT-CHECK the player's argument immediately — if they say anything wrong, inaccurate, exaggerated, or misleading, call it out CLEARLY and give the correct fact with real data.
2. COUNTER-ARGUE powerfully from your ${aiSide} position using real statistics and facts.
 
RESPONSE FORMAT — always respond in this exact JSON format:
{
  "hasError": true/false,
  "wrongClaim": "quote the player's incorrect statement if any, else null",
  "correction": "the correct fact with real data/statistics if there's an error, else null",
  "correctionFact": "a concise educational fact the player should remember, else null",
  "pointsDeducted": 0 or 1 (1 if they made a factual error),
  "counterArgument": "your powerful counter-argument as the ${aiSide} debater (2-3 sentences max, passionate and factual)",
  "pointsScored": 1 or 2 (how strong your counter-argument is),
  "debateTip": "a short coaching tip for the player to improve their next argument (1 sentence)"
}
 
RULES:
- Be STRICT about facts. If player says "solar is 100% clean" — correct them (manufacturing has emissions). 
- If player makes a genuinely good, accurate point, acknowledge it briefly before countering.
- Keep counter-arguments punchy, passionate, and under 60 words.
- Real statistics only (e.g., "Solar costs dropped 89% since 2010", "8 million tons of plastic enter oceans yearly").
- Always respond ONLY with valid JSON, no extra text.`;
}
 
// ── SEND ARGUMENT ─────────────────────────────────────────────────────────────
async function sendArgument() {
  if (!debateActive) return;
  const input = document.getElementById('arg-input');
  const text = input.value.trim();
  if (!text || isAITurn) return;
 
  input.value = '';
  autoResize(input);
  document.getElementById('send-btn').disabled = true;
  isAITurn = true;
  currentRound++;
  updateRoundBadge();
  renderTurnDots();
 
  // Add user message
  addMessage('user', text);
 
  // Show AI typing
  const typingId = addTyping();
 
  try {
    const response = await callClaude(text);
    removeTyping(typingId);
    processAIResponse(response, text);
  } catch (err) {
    removeTyping(typingId);
    addSystemMsg('⚠️ Connection issue. Please try again.');
    isAITurn = false;
    document.getElementById('send-btn').disabled = false;
  }
 
  if (currentRound >= MAX_ROUNDS) {
    setTimeout(endDebate, 1200);
    return;
  }
 
  isAITurn = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('arg-input').focus();
  scrollChat();
}
 
async function callClaude(userArg) {
  conversationHistory.push({
    role: 'assistant',
    content: 'I am ready. Please make your argument.'
  });
  conversationHistory.push({
    role: 'user',
    content: `Round ${currentRound}/${MAX_ROUNDS}. My argument: "${userArg}"\n\nRespond ONLY in the JSON format specified.`
  });
 
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: buildSystemPrompt(),
      messages: [
        { role: 'user', content: `Round ${currentRound}/${MAX_ROUNDS}. Player's argument: "${userArg}"\n\nRespond ONLY with valid JSON.` }
      ]
    })
  });
 
  if (!resp.ok) throw new Error('API error');
  const data = await resp.json();
  const raw = data.content[0].text.trim();
 
  // Parse JSON safely
  const jsonMatch = raw.match(/\{[\s\S]*\}/);
  if (!jsonMatch) throw new Error('No JSON');
  return JSON.parse(jsonMatch[0]);
}
 
function processAIResponse(data, userArg) {
  // 1. Show correction if error found
  if (data.hasError && data.wrongClaim) {
    const fact = data.correctionFact || '';
    addCorrectionMsg(data.wrongClaim, data.correction, fact);
    if (data.pointsDeducted > 0) {
      // no deduction from user, just educational
    }
    if (fact) learnedFacts.push(fact);
  }
 
  // 2. Score user
  if (!data.hasError) {
    const pts = 2;
    scoreYou += pts;
    document.getElementById('score-you').textContent = scoreYou;
    // add flash inside last user bubble
    addScoreFlash('you', '+' + pts);
  } else {
    const pts = 1;
    scoreYou += pts;
    document.getElementById('score-you').textContent = scoreYou;
    addScoreFlash('you', '+' + pts + ' (minor error found)');
  }
 
  // 3. AI counter argument
  if (data.counterArgument) {
    const aiSide = playerSide === 'pro' ? 'CON' : 'PRO';
    addMessage('ai', data.counterArgument, aiSide);
    scoreAI += data.pointsScored || 1;
    document.getElementById('score-ai').textContent = scoreAI;
  }
 
  // 4. Coaching tip
  if (data.debateTip && currentRound < MAX_ROUNDS) {
    setTimeout(() => {
      addSystemMsg('💬 Coach tip: ' + data.debateTip);
    }, 600);
  }
 
  scrollChat();
}
 
// ── END DEBATE ────────────────────────────────────────────────────────────────
function endDebate() {
  debateActive = false;
  let icon, title, titleClass, sub;
 
  if (scoreYou > scoreAI) {
    icon = '🏆'; title = 'You Won!'; titleClass = 'win';
    sub = 'Outstanding debating! You made strong, factual arguments on the environmental issue. Your critical thinking made the difference.';
  } else if (scoreAI > scoreYou) {
    icon = '🌱'; title = 'AI Wins'; titleClass = 'lose';
    sub = "The AI out-argued you this time, but every debate is a chance to learn. Review the facts and come back stronger!";
  } else {
    icon = '🤝'; title = "It's a Tie!"; titleClass = 'tie';
    sub = 'Equally matched! Both sides made strong points. The best debates often end in a draw — it means the issue is genuinely complex.';
  }
 
  document.getElementById('result-icon').textContent = icon;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-title').className = 'result-title ' + titleClass;
  document.getElementById('result-sub').textContent = sub;
  document.getElementById('final-you').textContent = scoreYou;
  document.getElementById('final-ai').textContent = scoreAI;
 
  const factsList = document.getElementById('facts-list');
  if (learnedFacts.length > 0) {
    factsList.innerHTML = learnedFacts.map(f =>
      '<div class="fact-item">✅ ' + f + '</div>'
    ).join('');
  } else {
    factsList.innerHTML = '<div class="fact-item">Great job — no major factual errors detected! 🎉</div>';
  }
 
  showScreen('endscreen');
}
 
// ── UI HELPERS ────────────────────────────────────────────────────────────────
function addMessage(role, text, badge) {
  const chat = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.id = 'msg-' + Date.now();
 
  const avatarEmoji = role === 'user' ? '🧑' : '🤖';
  const name = role === 'user' ? 'You' : 'AI Debater ' + (badge ? '(' + badge + ')' : '');
 
  div.innerHTML = `
    <div class="msg-avatar">${avatarEmoji}</div>
    <div class="msg-content">
      <div class="msg-name">${name}</div>
      <div class="bubble" id="bubble-${div.id}">${escHtml(text)}</div>
    </div>
  `;
  chat.appendChild(div);
  scrollChat();
  return div.id;
}
 
function addScoreFlash(side, label) {
  const chat = document.getElementById('chat-area');
  const msgs = chat.querySelectorAll('.msg.' + side);
  if (msgs.length === 0) return;
  const last = msgs[msgs.length - 1];
  const bubble = last.querySelector('.bubble');
  if (!bubble) return;
  const flash = document.createElement('div');
  flash.className = 'score-flash' + (label.includes('error') ? ' deduct' : '');
  flash.textContent = '⚡ ' + label;
  bubble.appendChild(flash);
}
 
function addCorrectionMsg(wrong, right, fact) {
  const chat = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg correction';
  div.innerHTML = `
    <div class="msg-avatar">⚠️</div>
    <div class="msg-content">
      <div class="bubble">
        <div class="correction-header">⚠️ Fact Check Alert</div>
        <div class="correction-wrong">"${escHtml(wrong)}"</div>
        <div class="correction-right">✅ ${escHtml(right)}</div>
        ${fact ? '<div class="fact-chip">📚 ' + escHtml(fact) + '</div>' : ''}
      </div>
    </div>
  `;
  chat.appendChild(div);
  scrollChat();
}
 
function addSystemMsg(text) {
  const chat = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg system';
  div.innerHTML = `
    <div class="msg-avatar">💬</div>
    <div class="msg-content">
      <div class="bubble">${escHtml(text)}</div>
    </div>
  `;
  chat.appendChild(div);
  scrollChat();
}
 
function addTyping() {
  const chat = document.getElementById('chat-area');
  const id = 'typing-' + Date.now();
  const div = document.createElement('div');
  div.className = 'msg ai'; div.id = id;
  div.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div class="msg-content">
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
    </div>
  `;
  chat.appendChild(div);
  scrollChat();
  return id;
}
 
function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}
 
function scrollChat() {
  const c = document.getElementById('chat-area');
  setTimeout(() => { c.scrollTop = c.scrollHeight; }, 50);
}
 
function renderTurnDots() {
  const row = document.getElementById('turns-row');
  row.innerHTML = Array.from({length: MAX_ROUNDS}, (_, i) => {
    let cls = 'turn-dot';
    if (i < currentRound - 1) cls += ' done';
    else if (i === currentRound - 1) cls += ' current';
    return '<div class="' + cls + '"></div>';
  }).join('');
}
 
function updateRoundBadge() {
  document.getElementById('round-badge').textContent = 'Round ' + Math.min(currentRound, MAX_ROUNDS) + '/' + MAX_ROUNDS;
}
 
function updateHints() {
  const hints = playerSide === 'pro' ? selectedTopic.proHints : selectedTopic.conHints;
  const container = document.getElementById('hint-chips');
  container.innerHTML = hints.map(h =>
    '<div class="hint-chip" onclick="useHint(\'' + h + '\')">💡 ' + h + '</div>'
  ).join('');
}
 
function useHint(hint) {
  const input = document.getElementById('arg-input');
  input.value = input.value ? input.value + ' ' + hint : hint;
  input.focus();
  autoResize(input);
}
 
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendArgument();
  }
}
 
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}
 
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
 
init();
</script>
</body>
</html>
