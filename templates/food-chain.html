<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌿 Food Chain Jigsaw</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --green-dark:#1b4332;
  --green-mid:#2d6a4f;
  --green-light:#52b788;
  --green-accent:#95d5b2;
  --gold:#ffd166;
  --red:#ef233c;
  --bg:#0d1b2a;
  --panel:#112240;
  --panel2:#1a3050;
  --text:#e8f4f8;
  --text2:#a8c5da;
  --border:rgba(149,213,178,0.2);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text);user-select:none;}
body{display:flex;flex-direction:column;}

#hdr{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 14px;
  background:linear-gradient(135deg,var(--green-dark),var(--green-mid));
  border-bottom:2px solid var(--green-light);
  flex-shrink:0;position:relative;z-index:10;
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
}
.back-btn{
  display:flex;align-items:center;gap:3px;font-family:'Fredoka One',cursive;
  font-size:1rem;color:#fff;background:rgba(255,255,255,0.15);
  border:1.5px solid rgba(255,255,255,0.35);border-radius:50px;
  padding:4px 12px;cursor:pointer;text-decoration:none;transition:all .2s;white-space:nowrap;
}
.back-btn:hover{background:rgba(255,255,255,0.28);}
.game-title{font-family:'Fredoka One',cursive;font-size:clamp(.95rem,3vw,1.3rem);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.3);flex:1;white-space:nowrap;}
.pill{
  font-family:'Fredoka One',cursive;font-size:clamp(.65rem,1.8vw,.8rem);
  padding:3px 10px;border-radius:50px;border:1.5px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.25);color:#e8f5e9;white-space:nowrap;
}
.pill.gold{border-color:var(--gold);color:var(--gold);}
select{
  font-family:'Nunito',sans-serif;font-weight:700;font-size:clamp(.65rem,1.8vw,.8rem);
  padding:4px 8px;border-radius:50px;border:1.5px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);color:#fff;cursor:pointer;
}
select option{background:#2d6a4f;}
.hbtn{
  font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(.65rem,1.8vw,.8rem);
  padding:4px 12px;border-radius:50px;cursor:pointer;border:none;transition:all .18s;white-space:nowrap;
}
.hbtn.go{background:var(--green-accent);color:var(--green-dark);}
.hbtn.hint{background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.3);}
.hbtn.preview-btn{background:var(--gold);color:#1a1a00;border:none;}
.hbtn:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.3);}
.hbtn:active{transform:scale(.95);}

#progbar{height:4px;background:rgba(255,255,255,.08);flex-shrink:0;}
#progfill{height:4px;background:linear-gradient(90deg,var(--green-light),var(--green-accent));width:0%;transition:width .35s;}

#game{display:flex;flex:1;min-height:0;overflow:hidden;}

#leftpanel{
  width:clamp(110px,18vw,160px);flex-shrink:0;
  display:flex;flex-direction:column;
  background:var(--panel);
  border-right:1.5px solid var(--border);
  padding:8px;gap:6px;overflow:hidden;
}
#prevlbl{
  font-family:'Fredoka One',cursive;font-size:.8rem;color:var(--green-accent);
  text-align:center;padding:2px 0 4px;border-bottom:1px solid var(--border);flex-shrink:0;
}
#prevWrap{
  border-radius:8px;overflow:hidden;border:1.5px solid var(--border);
  background:#000;flex-shrink:0;position:relative;cursor:pointer;
}
#prevWrap:hover #prevHover{opacity:1;}
#prevHover{
  position:absolute;inset:0;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;color:#fff;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;
  text-align:center;padding:4px;
}
#prevCanvas{display:block;width:100%;height:auto;}
#prevStats{font-size:.7rem;color:var(--text2);text-align:center;line-height:1.7;}
#prevStats strong{color:var(--green-accent);}

#boardwrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:10px;overflow:hidden;min-width:0;
}
#boardCanvas{
  display:block;border-radius:10px;
  border:2px solid var(--green-light);
  touch-action:none;cursor:default;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
}

#rightpanel{
  width:clamp(110px,20vw,155px);flex-shrink:0;
  display:flex;flex-direction:column;
  background:var(--panel);
  border-left:1.5px solid var(--border);
  overflow:hidden;
}
#traylbl{
  font-family:'Fredoka One',cursive;font-size:.8rem;color:var(--green-accent);
  text-align:center;padding:6px 0 4px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
#trayBox{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:6px;
  scrollbar-width:thin;scrollbar-color:rgba(149,213,178,.3) transparent;
  background:var(--panel2);
  margin:6px;border-radius:8px;border:1.5px dashed var(--border);
}
#trayBox::-webkit-scrollbar{width:4px;}
#trayBox::-webkit-scrollbar-thumb{background:rgba(149,213,178,.3);border-radius:99px;}
#trayCanvas{display:block;touch-action:none;}
#trayCount{
  font-size:.7rem;color:var(--text2);text-align:center;padding:4px 0 6px;flex-shrink:0;
}

#ghost{position:fixed;pointer-events:none;z-index:9999;display:none;}

#previewModal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);
  align-items:center;justify-content:center;z-index:9990;backdrop-filter:blur(6px);
}
#previewModal.show{display:flex;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
#previewBox{
  background:var(--panel);border:2px solid var(--green-light);
  border-radius:16px;padding:16px;text-align:center;
  max-width:min(92vw,560px);width:90%;
}
#previewBox h3{font-family:'Fredoka One',cursive;color:var(--green-accent);margin-bottom:10px;font-size:1.1rem;}
#modalCanvas{display:block;width:100%;height:auto;border-radius:8px;border:1.5px solid var(--border);}
#previewBox p{font-size:.78rem;color:var(--text2);margin-top:8px;}
.close-modal{margin-top:10px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;padding:6px 18px;border-radius:50px;background:var(--green-accent);color:var(--green-dark);border:none;cursor:pointer;}

#winlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:9980;align-items:center;justify-content:center;}
#winlay.show{display:flex;animation:popIn .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
#winbox{
  background:linear-gradient(145deg,var(--green-dark),var(--green-mid));
  border:2px solid var(--green-accent);border-radius:20px;
  padding:28px 24px;text-align:center;max-width:320px;width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.win-emoji{font-size:3rem;display:block;margin-bottom:6px;animation:bounce .5s ease;}
@keyframes bounce{0%{transform:scale(0) rotate(-15deg)}65%{transform:scale(1.2)}100%{transform:scale(1)}}
.win-title{font-family:'Fredoka One',cursive;font-size:1.8rem;color:var(--green-accent);}
#winstats{background:rgba(0,0,0,.25);border-radius:10px;padding:10px 14px;margin:.8rem 0;font-size:.88rem;color:#c8e6c9;line-height:2.1;}
#winstats strong{color:var(--green-accent);}
#winnewhs{background:rgba(255,209,102,.15);border:1.5px solid var(--gold);border-radius:8px;padding:6px;font-family:'Fredoka One',cursive;color:var(--gold);margin-bottom:.8rem;display:none;font-size:.95rem;}
.wbtn{font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;padding:8px 20px;border-radius:50px;border:none;cursor:pointer;margin:4px;transition:all .2s;}
.wbtn.p{background:var(--green-accent);color:var(--green-dark);}
.wbtn.s{background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.3);}
.wbtn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.35);}
</style>
</head>
<body>

<div id="hdr">
  <a class="back-btn" href="javascript:history.back()">&#8249; Back</a>
  <span class="game-title">🌿 Food Chain Jigsaw</span>
  <span class="pill" id="tpill">⏱ 0:00</span>
  <span class="pill" id="mpill">👆 0</span>
  <span class="pill gold" id="hspill">🏆 —</span>
  <select id="diff" onchange="restart()">
    <option value="3">Easy 3×3</option>
    <option value="4" selected>Normal 4×4</option>
    <option value="5">Hard 5×5</option>
  </select>
  <button class="hbtn preview-btn" onclick="openPreview()">🖼 Preview</button>
  <button class="hbtn go" onclick="restart()">🔀 Shuffle</button>
  <button class="hbtn hint" onclick="doHint()">💡 Hint</button>
</div>
<div id="progbar"><div id="progfill"></div></div>

<div id="game">
  <div id="leftpanel">
    <div id="prevlbl">📷 Reference</div>
    <div id="prevWrap" onclick="openPreview()" title="Click to enlarge">
      <canvas id="prevCanvas"></canvas>
      <div id="prevHover">🔍 Enlarge</div>
    </div>
    <div id="prevStats">
      <strong id="sceneNameLbl">—</strong><br>
      Pieces: <strong id="piecesLbl">0</strong><br>
      Placed: <strong id="placedLbl">0</strong>
    </div>
  </div>

  <div id="boardwrap">
    <canvas id="boardCanvas"></canvas>
  </div>

  <div id="rightpanel">
    <div id="traylbl">🧩 Pieces</div>
    <div id="trayBox">
      <canvas id="trayCanvas"></canvas>
    </div>
    <div id="trayCount">— remaining</div>
  </div>
</div>

<canvas id="ghost"></canvas>

<div id="previewModal">
  <div id="previewBox">
    <h3>🖼 Reference Image</h3>
    <canvas id="modalCanvas"></canvas>
    <p>Use this to figure out where each piece belongs!</p>
    <button class="close-modal" onclick="closePreview()">Close</button>
  </div>
</div>

<div id="winlay">
  <div id="winbox">
    <span class="win-emoji">🎉</span>
    <div class="win-title">Puzzle Complete!</div>
    <div id="winstats"></div>
    <div id="winnewhs">⭐ New Best Time!</div>
    <button class="wbtn p" onclick="restart();closeWin()">Play Again</button>
    <button class="wbtn s" onclick="closeWin()">Close</button>
  </div>
</div>

<script>
const SCENE_NAMES = ['Jungle Food Chain','Ocean Food Chain','Desert Food Chain','Forest Food Chain'];
const SCENES = [drawJungle, drawOcean, drawDesert, drawForest];
let currentSceneIdx = Math.floor(Math.random() * SCENES.length);

// ── HELPER PRIMITIVES ──
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}
function cloud(ctx,cx,cy,sz){ctx.fillStyle='rgba(255,255,255,0.88)';[[0,0,1],[-.35,.06,.7],[.36,.05,.66],[-.18,-.28,.58],[.2,-.25,.54]].forEach(([dx,dy,s])=>{ctx.beginPath();ctx.arc(cx+dx*sz,cy+dy*sz,sz*s*.5,0,Math.PI*2);ctx.fill();});}
function tree(ctx,cx,by,r,h,c1,c2){ctx.fillStyle='#5d4037';ctx.fillRect(cx-r*.18,by-h,r*.36,h);ctx.fillStyle=c1;ctx.beginPath();ctx.arc(cx,by-h,r,0,Math.PI*2);ctx.fill();ctx.fillStyle=c2;ctx.beginPath();ctx.arc(cx+r*.4,by-h+r*.25,r*.62,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx-r*.4,by-h+r*.2,r*.58,0,Math.PI*2);ctx.fill();}
function sun(ctx,cx,cy,r,col1,col2,rays){ctx.fillStyle=col1+'44';ctx.beginPath();ctx.arc(cx,cy,r*2.2,0,Math.PI*2);ctx.fill();if(rays){ctx.strokeStyle=col1;ctx.lineWidth=2;for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r*1.05,cy+Math.sin(a)*r*1.05);ctx.lineTo(cx+Math.cos(a)*r*1.5,cy+Math.sin(a)*r*1.5);ctx.stroke();}}ctx.fillStyle=col1;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.fillStyle=col2;ctx.beginPath();ctx.arc(cx,cy,r*.75,0,Math.PI*2);ctx.fill();}
function lbl(ctx,t,cx,cy,W){ctx.save();const fs=Math.max(9,~~(W*.027));ctx.font=`800 ${fs}px 'Nunito',sans-serif`;ctx.textAlign='center';ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillText(t,cx+1,cy+1);ctx.fillStyle='#fff';ctx.fillText(t,cx,cy);ctx.restore();}
function arr(ctx,x1,y1,x2,y2){ctx.save();ctx.strokeStyle='rgba(239,35,60,0.92)';ctx.lineWidth=2.2;ctx.setLineDash([5,3]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);const a=Math.atan2(y2-y1,x2-x1);ctx.fillStyle='rgba(239,35,60,0.92)';ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-10*Math.cos(a-.42),y2-10*Math.sin(a-.42));ctx.lineTo(x2-10*Math.cos(a+.42),y2-10*Math.sin(a+.42));ctx.fill();ctx.restore();}
function titleBar(ctx,text,W,H,col){ctx.fillStyle=col;rrect(ctx,W*.06,H*.03,W*.88,H*.1,5);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font=`bold ${~~(H*.056)}px 'Fredoka One',cursive`;ctx.textAlign='center';ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=4;ctx.fillText(text,W*.5,H*.1);ctx.shadowBlur=0;}

// ── CHARACTERS ──
function drawLeaf(ctx,cx,cy,sz){ctx.save();ctx.translate(cx,cy);ctx.fillStyle='#4caf50';ctx.beginPath();ctx.moveTo(0,-sz*.55);ctx.bezierCurveTo(sz*.45,-sz*.4,sz*.5,sz*.2,0,sz*.52);ctx.bezierCurveTo(-sz*.5,sz*.2,-sz*.45,-sz*.4,0,-sz*.55);ctx.fill();ctx.strokeStyle='#1b5e20';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-sz*.5);ctx.lineTo(0,sz*.5);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-sz*.05);ctx.lineTo(sz*.3,sz*.12);ctx.moveTo(0,-sz*.05);ctx.lineTo(-sz*.3,sz*.12);ctx.stroke();ctx.restore();}
function drawCaterpillar(ctx,cx,cy,sz){['#9ccc65','#aed581','#9ccc65','#aed581'].forEach((c,i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(cx-i*sz*.22,cy,sz*.28,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#558b2f';ctx.lineWidth=1;ctx.stroke();});ctx.fillStyle='#8bc34a';ctx.beginPath();ctx.arc(cx+sz*.1,cy,sz*.32,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#33691e';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx+sz*.18,cy-sz*.1,sz*.09,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1a237e';ctx.beginPath();ctx.arc(cx+sz*.19,cy-sz*.1,sz*.055,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#33691e';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx+sz*.14,cy+sz*.08,sz*.1,.2,Math.PI-.2);ctx.stroke();ctx.strokeStyle='#558b2f';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx+sz*.07,cy-sz*.3);ctx.lineTo(cx+sz*.01,cy-sz*.55);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+sz*.17,cy-sz*.3);ctx.lineTo(cx+sz*.25,cy-sz*.55);ctx.stroke();ctx.fillStyle='#dcedc8';ctx.beginPath();ctx.arc(cx+sz*.01,cy-sz*.57,sz*.07,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+sz*.25,cy-sz*.57,sz*.07,0,Math.PI*2);ctx.fill();}
function drawFrog(ctx,cx,cy,sz){ctx.fillStyle='#66bb6a';ctx.beginPath();ctx.ellipse(cx,cy,sz*.54,sz*.38,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#388e3c';ctx.lineWidth=1.5;ctx.stroke();[[-1],[1]].forEach(([d])=>{ctx.fillStyle='#a5d6a7';ctx.beginPath();ctx.arc(cx+d*sz*.32,cy-sz*.38,sz*.21,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#2e7d32';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#1b5e20';ctx.beginPath();ctx.arc(cx+d*sz*.32,cy-sz*.38,sz*.11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx+d*sz*.32+2,cy-sz*.38-2,sz*.048,0,Math.PI*2);ctx.fill();});ctx.fillStyle='#c8e6c9';ctx.beginPath();ctx.ellipse(cx,cy+sz*.05,sz*.29,sz*.2,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#388e3c';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy+sz*.05,sz*.18,.3,Math.PI-.3);ctx.stroke();[[-1],[1]].forEach(([d])=>{ctx.fillStyle='#66bb6a';ctx.beginPath();ctx.ellipse(cx+d*sz*.62,cy+sz*.22,sz*.18,sz*.1,d*.35,0,Math.PI*2);ctx.fill();});}

// FIX: Eagle drawn more compact so it fits within its piece without bleeding
function drawEagle(ctx,cx,cy,sz){
  // Scale down slightly and make more compact
  const s=sz*0.85;
  ctx.fillStyle='#4e342e';
  ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.bezierCurveTo(cx-s*.4,cy-s*.22,cx-s*.72,cy+s*.04,cx-s*.65,cy+s*.22);
  ctx.bezierCurveTo(cx-s*.4,cy+s*.32,cx-s*.1,cy+s*.1,cx,cy);ctx.fill();
  ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.bezierCurveTo(cx+s*.4,cy-s*.22,cx+s*.72,cy+s*.04,cx+s*.65,cy+s*.22);
  ctx.bezierCurveTo(cx+s*.4,cy+s*.32,cx+s*.1,cy+s*.1,cx,cy);ctx.fill();
  ctx.fillStyle='#eceff1';ctx.beginPath();ctx.arc(cx,cy-s*.16,s*.18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffa000';ctx.beginPath();ctx.moveTo(cx+s*.15,cy-s*.2);ctx.lineTo(cx+s*.32,cy-s*.14);ctx.lineTo(cx+s*.15,cy-s*.07);ctx.fill();
  ctx.fillStyle='#1a237e';ctx.beginPath();ctx.arc(cx+s*.06,cy-s*.21,s*.05,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx+s*.07,cy-s*.215,s*.02,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5d4037';
  ctx.beginPath();ctx.moveTo(cx-s*.05,cy+s*.28);ctx.lineTo(cx-s*.09,cy+s*.45);ctx.lineTo(cx+s*.01,cy+s*.44);ctx.fill();
  ctx.beginPath();ctx.moveTo(cx+s*.05,cy+s*.28);ctx.lineTo(cx+s*.09,cy+s*.45);ctx.lineTo(cx-.01*s,cy+s*.44);ctx.fill();
}

function drawFish(ctx,cx,cy,sz,col,dir){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(cx,cy,sz*.5,sz*.26,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(cx+dir*sz*.48,cy);ctx.lineTo(cx+dir*sz*.75,cy-sz*.2);ctx.lineTo(cx+dir*sz*.75,cy+sz*.2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.ellipse(cx-dir*sz*.1,cy-sz*.06,sz*.2,sz*.12,-.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx-dir*sz*.25,cy-sz*.06,sz*.09,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1a237e';ctx.beginPath();ctx.arc(cx-dir*sz*.24,cy-sz*.055,sz*.055,0,Math.PI*2);ctx.fill();}
function drawShark(ctx,cx,cy,sz){ctx.fillStyle='#546e7a';ctx.beginPath();ctx.moveTo(cx-sz*.75,cy);ctx.bezierCurveTo(cx-sz*.4,cy-sz*.22,cx+sz*.25,cy-sz*.18,cx+sz*.75,cy);ctx.bezierCurveTo(cx+sz*.25,cy+sz*.18,cx-sz*.4,cy+sz*.18,cx-sz*.75,cy);ctx.fill();ctx.fillStyle='#78909c';ctx.beginPath();ctx.ellipse(cx-sz*.05,cy+sz*.04,sz*.32,sz*.14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#546e7a';ctx.beginPath();ctx.moveTo(cx-sz*.08,cy-sz*.16);ctx.lineTo(cx+sz*.02,cy-sz*.44);ctx.lineTo(cx+sz*.12,cy-sz*.16);ctx.fill();ctx.beginPath();ctx.moveTo(cx+sz*.45,cy-sz*.05);ctx.lineTo(cx+sz*.58,cy-sz*.22);ctx.lineTo(cx+sz*.62,cy+sz*.02);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx+sz*.4,cy-sz*.04,sz*.09,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1a237e';ctx.beginPath();ctx.arc(cx+sz*.41,cy-sz*.035,sz*.055,0,Math.PI*2);ctx.fill();}

// ═══════════════════════════════════════════════════════
// JIGSAW ENGINE — SEAMLESS PIECE RENDERING (NO GAPS)
// ═══════════════════════════════════════════════════════
let G=4, IW=360, IH=270, PW=90, PH=67;
let pieces=[], tray=[], board=[];
let edgeMap={};
const TAB=0.21;
let fullImg=null;

function getEdge(r,c,side){
  const k=`${r}_${c}_${side}`;
  if(edgeMap[k]!==undefined)return edgeMap[k];
  const flat=(side==='top'&&r===0)||(side==='bottom'&&r===G-1)||(side==='left'&&c===0)||(side==='right'&&c===G-1);
  if(flat){edgeMap[k]=0;return 0;}
  const v=Math.random()<.5?1:-1; edgeMap[k]=v;
  if(side==='right')edgeMap[`${r}_${c+1}_left`]=-v;
  if(side==='bottom')edgeMap[`${r+1}_${c}_top`]=-v;
  return v;
}

function makePath(ctx,pw,ph,t,ri,b,l){
  const tx=TAB*pw,ty=TAB*ph;
  ctx.beginPath();
  ctx.moveTo(0,0);
  if(t===0){ctx.lineTo(pw,0);}else{ctx.lineTo(pw*.28,0);ctx.bezierCurveTo(pw*.28,-t*ty*.8,pw*.5-tx*.4,-t*ty*1.1,pw*.5,-t*ty*1.1);ctx.bezierCurveTo(pw*.5+tx*.4,-t*ty*1.1,pw*.72,-t*ty*.8,pw*.72,0);ctx.lineTo(pw,0);}
  if(ri===0){ctx.lineTo(pw,ph);}else{ctx.lineTo(pw,ph*.28);ctx.bezierCurveTo(pw+ri*tx*.8,ph*.28,pw+ri*tx*1.1,ph*.5-ty*.4,pw+ri*tx*1.1,ph*.5);ctx.bezierCurveTo(pw+ri*tx*1.1,ph*.5+ty*.4,pw+ri*tx*.8,ph*.72,pw,ph*.72);ctx.lineTo(pw,ph);}
  if(b===0){ctx.lineTo(0,ph);}else{ctx.lineTo(pw*.72,ph);ctx.bezierCurveTo(pw*.72,ph+b*ty*.8,pw*.5+tx*.4,ph+b*ty*1.1,pw*.5,ph+b*ty*1.1);ctx.bezierCurveTo(pw*.5-tx*.4,ph+b*ty*1.1,pw*.28,ph+b*ty*.8,pw*.28,ph);ctx.lineTo(0,ph);}
  if(l===0){ctx.lineTo(0,0);}else{ctx.lineTo(0,ph*.72);ctx.bezierCurveTo(-l*tx*.8,ph*.72,-l*tx*1.1,ph*.5+ty*.4,-l*tx*1.1,ph*.5);ctx.bezierCurveTo(-l*tx*1.1,ph*.5-ty*.4,-l*tx*.8,ph*.28,0,ph*.28);ctx.lineTo(0,0);}
  ctx.closePath();
}

function buildPieces(imgCanvas){
  edgeMap={}; pieces=[];
  // FIX: Use larger pad to fully capture tab overhangs, no clipping artifacts
  const pad=Math.ceil(Math.max(PW,PH)*TAB*1.6)+6;
  for(let r=0;r<G;r++){
    for(let c=0;c<G;c++){
      const t=getEdge(r,c,'top'),ri=getEdge(r,c,'right'),b=getEdge(r,c,'bottom'),l=getEdge(r,c,'left');
      const cw=PW+pad*2, ch=PH+pad*2;
      const pc=document.createElement('canvas'); pc.width=cw; pc.height=ch;
      const px=pc.getContext('2d');

      // FIX: Draw clipped piece image WITHOUT anti-alias bleed / dark border
      px.save();
      px.translate(pad,pad);
      makePath(px,PW,PH,t,ri,b,l);
      px.clip();
      // Draw the source image region into this piece (offset by pad so tabs get image too)
      px.drawImage(imgCanvas,
        c*PW - pad, r*PH - pad,          // src x,y
        PW + pad*2, PH + pad*2,           // src w,h
        -pad, -pad,                        // dst x,y
        PW + pad*2, PH + pad*2            // dst w,h
      );
      px.restore();

      // FIX: Draw seam outline ONLY — very subtle, white, thin, no dark fill
      px.save();
      px.translate(pad,pad);
      makePath(px,PW,PH,t,ri,b,l);
      px.strokeStyle='rgba(255,255,255,0.55)';
      px.lineWidth=1.2;
      px.stroke();
      px.restore();

      pieces.push({r,c,cv:pc,pad,placed:false,tX:0,tY:0,tS:1});
    }
  }
}

// ── SIZING ──
function calcSizes(){
  const bw=document.getElementById('boardwrap');
  const aw=bw.clientWidth-20, ah=bw.clientHeight-20;
  G=parseInt(document.getElementById('diff').value);
  let w=Math.min(aw,ah*(4/3)), h=w*(3/4);
  if(h>ah){h=ah;w=h*(4/3);}
  IW=~~w; IH=~~h; PW=~~(IW/G); PH=~~(IH/G);
  const bc=document.getElementById('boardCanvas');
  bc.width=IW; bc.height=IH;
  bc.style.width=IW+'px'; bc.style.height=IH+'px';
}

function updatePreviewPanel(){
  const pc=document.getElementById('prevCanvas');
  const pw=document.getElementById('prevWrap').clientWidth-4;
  pc.width=IW; pc.height=IH;
  pc.style.width=pw+'px'; pc.style.height='auto';
  if(fullImg) pc.getContext('2d').drawImage(fullImg,0,0);
  document.getElementById('sceneNameLbl').textContent=SCENE_NAMES[currentSceneIdx%SCENE_NAMES.length];
  const mc=document.getElementById('modalCanvas');
  mc.width=IW; mc.height=IH;
  if(fullImg) mc.getContext('2d').drawImage(fullImg,0,0);
}

function layoutTray(){
  const ts=document.getElementById('trayBox');
  const tw=ts.clientWidth-4;
  const s=Math.min(0.62,Math.max(0.28,(tw*.86)/PW));
  const pw=~~(PW*s), ph=~~(PH*s), gap=5;
  const cols=Math.max(1,~~((tw+gap)/(pw+gap)));
  tray.forEach((p,i)=>{p.tX=gap+(i%cols)*(pw+gap); p.tY=gap+~~(i/cols)*(ph+gap); p.tS=s;});
  const rows=Math.ceil(tray.length/cols);
  const tc=document.getElementById('trayCanvas');
  tc.width=tw||120; tc.height=Math.max(rows*(ph+gap)+gap, ph+gap*2);
  tc.style.width=tc.width+'px'; tc.style.height=tc.height+'px';
  document.getElementById('trayCount').textContent=tray.length+' remaining';
}

// ── RENDER ──
// FIX: Board renders the full scene image first as background, then pieces on top
// This eliminates ALL gaps — placed pieces are seamless because the same image is underneath
function renderBoard(){
  const bc=document.getElementById('boardCanvas'),ctx=bc.getContext('2d');
  ctx.clearRect(0,0,IW,IH);

  // FIX: Draw full background image so gaps between pieces show the correct image, not black
  if(fullImg){
    ctx.globalAlpha=0.18; // dim unplaced area slightly
    ctx.drawImage(fullImg,0,0,IW,IH);
    ctx.globalAlpha=1.0;
  }

  // Grid guides (very subtle)
  ctx.strokeStyle='rgba(149,213,178,0.1)'; ctx.lineWidth=1;
  for(let r=0;r<=G;r++){ctx.beginPath();ctx.moveTo(0,r*PH);ctx.lineTo(IW,r*PH);ctx.stroke();}
  for(let c=0;c<=G;c++){ctx.beginPath();ctx.moveTo(c*PW,0);ctx.lineTo(c*PW,IH);ctx.stroke();}

  // Draw placed pieces — they sit on top and look perfectly seamless
  board.forEach(p=>{
    if(p===hintP){ctx.save();ctx.filter='drop-shadow(0 0 9px #ffd166)';}
    ctx.drawImage(p.cv, p.c*PW - p.pad, p.r*PH - p.pad);
    if(p===hintP)ctx.restore();
  });
}

function renderTray(){
  const tc=document.getElementById('trayCanvas'),ctx=tc.getContext('2d');
  ctx.clearRect(0,0,tc.width,tc.height);
  tray.forEach(p=>{
    if(drag&&drag.p===p)return;
    ctx.save();ctx.translate(p.tX,p.tY);ctx.scale(p.tS,p.tS);
    ctx.shadowColor='rgba(0,0,0,0.4)';ctx.shadowBlur=5;
    ctx.drawImage(p.cv,-p.pad,-p.pad);
    ctx.restore();
  });
}
function render(){renderBoard();renderTray();}

// ── DRAG ──
let drag=null,hintP=null,hintT=null;
const ghost=document.getElementById('ghost');

function startDrag(p,cx,cy,scale){
  drag={p,scale};
  const gw=~~(p.cv.width*scale),gh=~~(p.cv.height*scale);
  ghost.width=gw; ghost.height=gh;
  ghost.style.width=gw+'px'; ghost.style.height=gh+'px'; ghost.style.display='block';
  const g=ghost.getContext('2d'); g.clearRect(0,0,gw,gh);
  g.save(); g.scale(scale,scale); g.globalAlpha=.9; g.drawImage(p.cv,0,0); g.restore();
  moveGhost(cx,cy,p,scale);
}
function moveGhost(cx,cy,p,scale){
  ghost.style.left=(cx-p.cv.width*scale/2)+'px';
  ghost.style.top=(cy-p.cv.height*scale/2)+'px';
}
function dropAt(cx,cy){
  if(!drag){ghost.style.display='none';return;}
  const p=drag.p; ghost.style.display='none';
  const br=document.getElementById('boardCanvas').getBoundingClientRect();
  const bx=(cx-br.left)*(IW/br.width), by=(cy-br.top)*(IH/br.height);
  const snapR=Math.min(PW,PH)*.46;
  const tx=p.c*PW+PW/2, ty=p.r*PH+PH/2;
  if(bx>0&&bx<IW&&by>0&&by<IH&&Math.abs(bx-tx)<snapR&&Math.abs(by-ty)<snapR){
    p.placed=true; tray=tray.filter(x=>x!==p);
    if(!board.includes(p))board.push(p);
    moves++;
  } else {
    if(p.placed){p.placed=false;board=board.filter(x=>x!==p);}
    if(!tray.includes(p))tray.push(p);
  }
  drag=null; layoutTray(); render(); updateUI();
  if(board.length===pieces.length)setTimeout(onWin,350);
}

const bc=document.getElementById('boardCanvas');
function pickBoard(cx,cy){
  const br=bc.getBoundingClientRect();
  const bx=(cx-br.left)*(IW/br.width), by=(cy-br.top)*(IH/br.height);
  for(let i=board.length-1;i>=0;i--){
    const p=board[i];
    if(bx>=p.c*PW&&bx<(p.c+1)*PW&&by>=p.r*PH&&by<(p.r+1)*PH){
      board.splice(i,1); p.placed=false;
      startDrag(p,cx,cy,1); render(); return;
    }
  }
}
bc.addEventListener('mousedown',e=>{e.preventDefault();pickBoard(e.clientX,e.clientY);});
bc.addEventListener('touchstart',e=>{e.preventDefault();pickBoard(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});

const tc=document.getElementById('trayCanvas');
function pickTray(cx,cy){
  const r=tc.getBoundingClientRect();
  const tx=(cx-r.left)*(tc.width/r.width), ty=(cy-r.top)*(tc.height/r.height);
  for(let i=tray.length-1;i>=0;i--){
    const p=tray[i];
    if(tx>=p.tX&&tx<p.tX+PW*p.tS&&ty>=p.tY&&ty<p.tY+PH*p.tS){
      startDrag(p,cx,cy,p.tS); render(); return;
    }
  }
}
tc.addEventListener('mousedown',e=>{e.preventDefault();pickTray(e.clientX,e.clientY);});
tc.addEventListener('touchstart',e=>{e.preventDefault();pickTray(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});

window.addEventListener('mousemove',e=>{if(!drag)return;moveGhost(e.clientX,e.clientY,drag.p,drag.scale);});
window.addEventListener('touchmove',e=>{if(!drag)return;e.preventDefault();moveGhost(e.touches[0].clientX,e.touches[0].clientY,drag.p,drag.scale);},{passive:false});
window.addEventListener('mouseup',e=>dropAt(e.clientX,e.clientY));
window.addEventListener('touchend',e=>{if(!drag)return;dropAt(e.changedTouches[0].clientX,e.changedTouches[0].clientY);},{passive:false});

// ── TIMER / UI ──
let secs=0,moves=0,tid=null;
function fmt(s){const m=~~(s/60),sc=s%60;return m?`${m}m${sc<10?'0':''}${sc}s`:`${sc}s`;}
function hsKey(){return `fcjig_${G}`;}
function getHS(){const v=localStorage.getItem(hsKey());return v?+v:null;}
function saveHS(s){const c=getHS();if(c===null||s<c){localStorage.setItem(hsKey(),s);return true;}return false;}
function updateHS(){const h=getHS();document.getElementById('hspill').textContent='🏆 '+(h?fmt(h):'—');}
function startTimer(){clearInterval(tid);secs=0;tid=setInterval(()=>{secs++;document.getElementById('tpill').textContent='⏱ '+fmt(secs);},1000);}
function updateUI(){
  const pl=board.length,tot=pieces.length;
  document.getElementById('progfill').style.width=(tot?pl/tot*100:0)+'%';
  document.getElementById('mpill').textContent='👆 '+moves;
  document.getElementById('placedLbl').textContent=pl;
  document.getElementById('piecesLbl').textContent=tot;
  document.getElementById('trayCount').textContent=tray.length+' remaining';
}
function doHint(){
  if(!board.length)return;
  hintP=board[~~(Math.random()*board.length)];
  clearTimeout(hintT); render();
  hintT=setTimeout(()=>{hintP=null;render();},1800);
}
function onWin(){
  clearInterval(tid);
  const isNew=saveHS(secs); updateHS();
  document.getElementById('winstats').innerHTML=`⏱ Time: <strong>${fmt(secs)}</strong><br>👆 Moves: <strong>${moves}</strong><br>🧩 Pieces: <strong>${pieces.length}</strong>`;
  document.getElementById('winnewhs').style.display=isNew?'block':'none';
  document.getElementById('winlay').classList.add('show');
}
function closeWin(){document.getElementById('winlay').classList.remove('show');}

function openPreview(){document.getElementById('previewModal').classList.add('show');}
function closePreview(){document.getElementById('previewModal').classList.remove('show');}
document.getElementById('previewModal').addEventListener('click',function(e){if(e.target===this)closePreview();});

function restart(){
  clearInterval(tid); drag=null; hintP=null; moves=0; board=[]; tray=[];
  ghost.style.display='none';
  document.getElementById('winlay').classList.remove('show');
  calcSizes();
  fullImg=document.createElement('canvas'); fullImg.width=IW; fullImg.height=IH;
  SCENES[currentSceneIdx % SCENES.length](fullImg.getContext('2d'), IW, IH);
  buildPieces(fullImg);
  tray=[...pieces].sort(()=>Math.random()-.5);
  updatePreviewPanel();
  layoutTray(); updateHS(); updateUI(); startTimer();
  document.getElementById('tpill').textContent='⏱ 0:00';
  render();
}

window.addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(restart,250);});
window.addEventListener('load',()=>setTimeout(restart,40));
</script>
